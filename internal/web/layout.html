<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nextleaf</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="alternate icon" href="/static/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#3f7d54">
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
  <script>
    // Apply a saved theme override before first paint to avoid a flash.
    (function () {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg:       light-dark(#eef0e6, #171d18);
      --card:     light-dark(#fbfaf5, #202a21);
      --ink:      light-dark(#24312a, #e9ece2);
      --muted:    light-dark(#64756a, #9aa894);
      --moss:     light-dark(#3f7d54, #7cc491);
      --on-moss:  light-dark(#fbfaf5, #171d18);
      --tint:     light-dark(rgba(63,125,84,0.10), rgba(124,196,145,0.12));
      --line:     light-dark(rgba(36,49,42,0.14), rgba(233,236,226,0.12));
      --error:      light-dark(#8c3b34, #e39e96);
      --error-tint: light-dark(rgba(140,59,52,0.07), rgba(227,158,150,0.09));
      --shadow-c: light-dark(rgba(36,49,42,0.35), rgba(0,0,0,0.6));
      --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"]  { color-scheme: dark; }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      line-height: 1.55;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 2.8rem 1.5rem 5rem; }

    /* Header */
    .masthead { display: flex; align-items: center; gap: 0.7rem; }
    .mark { width: 26px; height: 26px; color: var(--moss); flex: none; }
    h1 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; letter-spacing: -0.01em; margin: 0; }
    .theme-toggle {
      margin-left: auto; display: grid; place-items: center; width: 36px; height: 36px;
      color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 50%;
      cursor: pointer; transition: color 0.15s ease, border-color 0.15s ease;
    }
    .theme-toggle:hover { color: var(--moss); border-color: var(--moss); }
    .theme-toggle svg { width: 17px; height: 17px; }
    .lede { margin: 1.6rem 0 0; color: var(--muted); font-size: 0.92rem; }

    /* Recommendation card */
    .rec {
      position: relative; margin-top: 0.9rem; display: flex; gap: 1.3rem;
      background: var(--card); border-radius: 16px; padding: 1.4rem;
      box-shadow: 0 12px 28px -16px var(--shadow-c);
    }
    .ribbon {
      position: absolute; top: -6px; right: 1.4rem; width: 24px; height: 68px;
      background: var(--moss); border-radius: 2px 2px 0 0;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
    }
    .rec-body { min-width: 0; display: flex; flex-direction: column; }
    .eyebrow {
      font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--moss); margin-bottom: 0.4rem;
    }
    .rec-title { font-family: var(--serif); font-size: 1.7rem; font-weight: 600; line-height: 1.1; margin: 0; }
    .rec-author { color: var(--muted); font-size: 0.95rem; margin: 0.3rem 0 0; }
    .rec-series { color: var(--muted); font-size: 0.84rem; margin: 0.2rem 0 0; }
    .rec-meta { color: var(--muted); font-size: 0.8rem; margin: 0.5rem 0 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.85rem; }
    .tag { font-size: 0.72rem; color: var(--muted); background: var(--tint); border-radius: 999px; padding: 0.16rem 0.6rem; }
    .rec-origin {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      margin: 0.85rem 0 0; font-size: 0.75rem; color: var(--muted);
    }
    .shelf-badge {
      font-size: 0.72rem; font-weight: 600; color: var(--on-moss); background: var(--moss);
      border-radius: 999px; padding: 0.16rem 0.6rem;
    }
    .rec-source { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
    .rec-source:hover { color: var(--moss); }
    .rec-source:focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }

    /* Cover */
    .cover {
      display: block; width: 116px; flex: none; aspect-ratio: 2 / 3; object-fit: cover;
      border-radius: 6px; box-shadow: 0 8px 18px -10px var(--shadow-c);
    }
    .cover--blank {
      display: grid; place-items: center; padding: 0.6rem; text-align: center;
      background: var(--tint); color: var(--muted);
      font-family: var(--serif); font-size: 0.84rem; line-height: 1.3;
    }

    .rec-desc {
      margin: 1.1rem 0 0; color: var(--muted); font-size: 0.92rem; line-height: 1.5;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4;
      line-clamp: 4; overflow: hidden;
    }

    /* Why this pick */
    .why { margin-top: 1.6rem; }
    .why-group + .why-group { margin-top: 1.15rem; }
    .why-label {
      display: block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .why-label--for { color: var(--moss); }
    .why-label--against { color: var(--muted); }
    .why-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .why-list li { display: flex; gap: 0.65rem; align-items: baseline; font-size: 0.92rem; }
    .why-list .dot {
      flex: none; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center;
      font-size: 0.74rem; font-weight: 700; transform: translateY(2px);
    }
    .why-list--for .dot { background: var(--moss); color: var(--on-moss); }
    .why-list--against li { color: var(--muted); }
    .why-list--against .dot { background: var(--tint); color: var(--muted); }
    .why-none { color: var(--muted); font-size: 0.92rem; margin: 0; }

    /* Actions */
    .actions { margin-top: 1.7rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; font: inherit; font-size: 0.9rem; font-weight: 600;
      color: var(--on-moss); background: var(--moss); border: none; border-radius: 999px;
      padding: 0.58rem 1.3rem; text-decoration: none; cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.07); }
    :is(.btn, .theme-toggle):focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }

    /* Series decisions */
    .btn--quiet {
      color: var(--ink); background: transparent; border: 1px solid var(--line);
      padding: 0.5rem 1rem; font-weight: 500;
    }
    .btn--quiet:hover { filter: none; border-color: var(--moss); color: var(--moss); }
    .decide { display: contents; }

    /* Series drawer */
    .drawer-toggle {
      position: fixed; top: 1.4rem; right: 1.4rem; z-index: 3;
      display: inline-flex; align-items: center; gap: 0.45rem;
      font: inherit; font-size: 0.82rem; font-weight: 600; color: var(--ink);
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 0.5rem 1rem; cursor: pointer; text-decoration: none;
      box-shadow: 0 10px 24px -18px var(--shadow-c);
    }
    .drawer-toggle:hover { border-color: var(--moss); color: var(--moss); }
    /* display:inline-flex above would otherwise defeat the hidden attribute. */
    .drawer-toggle[hidden] { display: none; }
    .drawer-count {
      font-size: 0.72rem; color: var(--muted); background: var(--tint);
      border-radius: 999px; padding: 0.05rem 0.45rem;
    }

    /* The drawer is open when the URL carries #series, so it needs no script. */
    .drawer {
      --drawer-w: min(23rem, 100vw);
      position: fixed; top: 0; right: calc(-1 * var(--drawer-w)); z-index: 5;
      width: var(--drawer-w); height: 100vh;
      display: flex; flex-direction: column;
      background: var(--card); border-left: 1px solid var(--line);
      box-shadow: -24px 0 48px -32px var(--shadow-c);
      visibility: hidden;
      /* Position, not transform: a transform would become the containing
         block for the fixed overlay below and trap it inside the drawer. */
      transition: right 0.22s ease, visibility 0.22s;
    }
    /* The hash drives the drawer, mirrored onto a class by syncDrawer. The
       :target half of this rule went with the script-free path: with the
       script always present, one mechanism is enough. */
    .drawer.open { right: 0; visibility: visible; }
    .drawer-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; padding: 1.3rem 1.4rem 0.9rem; border-bottom: 1px solid var(--line);
    }
    .drawer-title { margin: 0; font-family: var(--serif); font-size: 1.15rem; font-weight: 600; }
    .drawer-close { color: var(--muted); text-decoration: none; font-size: 1.4rem; line-height: 1; }
    .drawer-close:hover { color: var(--moss); }
    .drawer-body { overflow-y: auto; padding: 1rem 1.4rem 2rem; }

    .drawer-group + .drawer-group { margin-top: 1.4rem; }
    .drawer-label {
      font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .drawer-summary {
      cursor: pointer; list-style: none; padding: 0.15rem 0;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .drawer-summary::-webkit-details-marker { display: none; }
    .drawer-summary::before { content: "\25B8"; font-size: 0.7em; }
    details[open] > .drawer-summary::before { content: "\25BE"; }
    .drawer-summary:hover { color: var(--moss); }
    .drawer-tally {
      font-size: 0.68rem; color: var(--muted); background: var(--tint);
      border-radius: 999px; padding: 0.02rem 0.4rem;
    }
    .drawer-list { list-style: none; margin: 0.5rem 0 0; padding: 0; }
    .drawer-row {
      display: grid; grid-template-columns: 2.6rem 1fr; gap: 0.7rem;
      padding: 0.7rem 0; border-top: 1px solid var(--line);
    }
    .drawer-list li:first-child .drawer-row { border-top: none; }
    .drawer-cover {
      width: 2.6rem; height: 3.9rem; object-fit: cover; border-radius: 3px;
      background: var(--tint);
    }
    .drawer-cover--blank { border: 1px dashed var(--line); }
    .drawer-name { font-size: 0.88rem; font-weight: 600; }
    .row-head { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; padding-right: 2.2rem; }
    /* Tags sit under the title rather than trailing it, so a long series name
       cannot push them out of sight. */
    .row-tags {
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
      margin-top: 0.2rem; padding-right: 2.2rem;
    }
    .drawer-group--flat > .drawer-label { display: block; padding: 0.15rem 0; }
    .drawer-next, .drawer-pos { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 0.1rem; }
    .drawer-acts { display: flex; gap: 0.7rem; margin-top: 0.4rem; flex-wrap: wrap; }
    .drawer-act {
      font: inherit; font-size: 0.75rem; color: var(--muted);
      background: none; border: none; padding: 0; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .drawer-act:hover { color: var(--moss); }
    .drawer-act--go { color: var(--moss); }
    /* Switching which series a row is tracked under: the row itself becomes
       the wheel. It lifts in place over a dimmed drawer, candidates roll
       through its footprint, and it settles back once one is chosen. */
    .drawer-dim {
      /* On the drawer itself, not the scrollable body: the dim must cover
         the panel wherever the reader has scrolled to. */
      position: absolute; inset: 0; z-index: 4;
      background: light-dark(rgba(36,49,42,0.35), rgba(0,0,0,0.55));
      opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .drawer.dimmed .drawer-dim { opacity: 1; pointer-events: auto; }

    .drawer-row { position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease; }
    .drawer-row.spinning {
      z-index: 5; background: var(--card);
      transform: scale(1.03); border-radius: 10px;
      box-shadow: 0 16px 36px -18px var(--shadow-c);
      padding-left: 0.45rem; padding-right: 0.45rem;
    }

    .switcher-btn {
      position: absolute; top: 50%; right: 0; z-index: 6;
      display: grid; place-items: center; width: 2.1rem; height: 2.1rem;
      font: inherit; font-size: 1.15rem; line-height: 1; cursor: pointer;
      color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px;
      transform: translateY(-50%);
      transition: transform 0.25s ease, color 0.15s ease, background 0.15s ease;
    }
    .switcher-btn:hover { color: var(--moss); border-color: var(--moss); }
    .spinning .switcher-btn {
      color: var(--moss); background: var(--tint); border-color: var(--moss);
      transform: translateY(-50%) rotate(180deg);
    }

    .wheel-face { display: none; }
    .spinning .row-body { display: none; }
    .spinning .wheel-face { display: grid; gap: 0.45rem; animation: wheel-in 0.18s ease-out; }
    @keyframes wheel-in {
      from { opacity: 0; transform: translateY(0.25rem); }
      to   { opacity: 1; transform: none; }
    }
    .wheel-ghost {
      display: none; position: absolute; left: 0; right: 0; z-index: 5;
      align-items: center; gap: 0.6rem; text-align: left;
      font: inherit; color: var(--ink); cursor: pointer;
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 0.45rem 0.55rem;
      /* Depth without transparency: a see-through card over the dimmed
         backdrop goes muddy, so the ghosts stay opaque and step back through
         size and a slightly darker surface instead. */
      filter: brightness(0.86); transform: scale(0.92);
      box-shadow: 0 8px 20px -14px var(--shadow-c);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    /* :not([hidden]) matters: the hidden attribute is plain display:none in
       the UA sheet, which this rule would otherwise override — leaving an
       empty card forced visible. */
    .spinning .wheel-ghost:not([hidden]) { display: flex; }
    .wheel-ghost:hover { filter: brightness(1); transform: scale(0.96); }
    .wheel-prev { bottom: calc(100% + 0.4rem); }
    .wheel-next { top: calc(100% + 0.4rem); }
    .ghost-cover { width: 1.8rem; height: 2.7rem; object-fit: cover; border-radius: 3px; flex: none; }
    .ghost-text { display: grid; gap: 0.15rem; min-width: 0; }
    .peek-name {
      font-size: 0.8rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ghost-badges { display: flex; gap: 0.35rem; }
    .wheel-item { display: grid; gap: 0.15rem; min-height: 3rem; align-content: center; width: calc(100% - 2.4rem); }
    .wheel-item.roll-up   { animation: roll-up 0.16s ease-out; }
    .wheel-item.roll-down { animation: roll-down 0.16s ease-out; }
    @keyframes roll-up {
      from { opacity: 0; transform: translateY(0.5rem); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes roll-down {
      from { opacity: 0; transform: translateY(-0.5rem); }
      to   { opacity: 1; transform: none; }
    }
    .wheel-meta { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .switch-source, .switch-pos {
      font-size: 0.62rem; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--muted); background: var(--tint); border-radius: 999px; padding: 0.03rem 0.4rem;
    }
    .switch-desc {
      font-size: 0.72rem; color: var(--muted); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .wheel-controls { display: flex; align-items: center; gap: 0.4rem; }
    .wheel-step, .wheel-cancel {
      display: grid; place-items: center; width: 1.7rem; height: 1.7rem;
      font: inherit; font-size: 0.72rem; cursor: pointer;
      color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    }
    .wheel-step:hover, .wheel-cancel:hover { color: var(--moss); border-color: var(--moss); }
    .wheel-ok {
      font: inherit; font-size: 0.78rem; font-weight: 600; cursor: pointer;
      color: var(--on-moss); background: var(--moss); border: none; border-radius: 999px;
      padding: 0.28rem 0.9rem; margin-left: auto;
    }
    .wheel-ok:hover { filter: brightness(1.07); }
    .switching .wheel-ok { opacity: 0.7; cursor: wait; }
    .switching .wheel-ghost { pointer-events: none; filter: brightness(0.75); }
    .wheel-cancel { margin-left: 0.1rem; }

    /* Notices */
    .notice {
      margin-top: 1.6rem; background: var(--card); border: 1px solid var(--line);
      padding: 1.1rem 1.3rem; border-radius: 12px; color: var(--muted);
      box-shadow: 0 12px 28px -16px var(--shadow-c);
    }
    .notice code { color: var(--moss); background: var(--tint); padding: 0.1rem 0.35rem; border-radius: 4px; }
    .notice--error { border-color: var(--error); background: var(--error-tint); color: var(--error); box-shadow: none; }

    @media (max-width: 460px) {
      .rec { flex-direction: column; }
      .cover { width: 104px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .btn, .theme-toggle { transition: none; }
      .btn:hover { transform: none; }
    }
    /* The waiting card holds the real card's footprint, so nothing jumps
       when the recommendation lands. Static by design: the motion floor caps
       animation at sub-200ms micro-interactions. */
    .deck > .waiting { display: none; }
    .deck > .waiting--initial { display: block; }
    /* A failed first load swaps the skeleton for the way out of it; a retry
       puts the skeleton back, so the deck is never left blank. */
    #app.failed .deck > .waiting--initial { display: none; }
    #app.htmx-request .deck > .waiting--initial { display: block; }
    #app.htmx-request .deck > .waiting { display: block; }
    /* The drawer sits outside .deck, so a decision never blanks it out from
       under a reader who is standing in it. */
    #app.htmx-request .deck > :not(.waiting) { display: none; }
    .rec--waiting { opacity: 0.55; }
    .bone {
      display: block; height: 0.72rem; border-radius: 999px;
      background: var(--tint); border: 1px solid var(--line);
    }
    .bone--eyebrow { width: 5.5rem; height: 0.6rem; }
    .bone--title { width: 80%; height: 1.15rem; margin-top: 0.55rem; }
    .bone--author { width: 45%; margin-top: 0.5rem; }
    /* An empty notice slot must not take up room between renders. */
    #flash:empty { display: none; }
  </style>
</head>
<body hx-ext="morph" hx-target="#app" hx-swap="morph:innerHTML"
      hx-sync="#app:replace" hx-indicator="#app">
  <main class="wrap">
    <header class="masthead">
      {{ mark }}
      <h1>Nextleaf</h1>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch between light and dark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <div id="app" hx-get="/view" hx-trigger="load" aria-live="polite" aria-busy="true">
      <div class="deck">
        <div class="waiting waiting--initial" aria-hidden="true">{{template "waitingCard"}}</div>
        <p class="notice deck-error" hidden>Couldn't reach the server for a recommendation.
          <button class="btn btn--quiet" type="button" hx-get="/view" hx-disabled-elt="this">Try again</button></p>
      </div>
    </div>
  </main>

  <a class="drawer-toggle" id="drawer-toggle" href="#series" hidden>Series <span class="drawer-count">0</span></a>
  <aside class="drawer" id="series" aria-label="Series you're tracking">
    <div class="drawer-head">
      <h2 class="drawer-title">Series</h2>
      <a class="drawer-close" href="#" aria-label="Close">&times;</a>
    </div>
    <div class="drawer-dim"></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/idiomorph-ext.min.js" defer></script>
  <script>
    // The series wheel. htmx owns the swapping; this layer only drives the
    // wheel's local state. Handlers are delegated from the mount, which is
    // never itself replaced, so a morph never leaves the drawer inert.
    (function () {
      var app = document.getElementById("app");
      var openRow = null;

      function drawer() { return document.querySelector(".drawer"); }

      // The hash stays the drawer's source of truth; the class is how the CSS
      // reads it, now that :target went with the script-free path.
      function syncDrawer() {
        var d = drawer();
        if (d) { d.classList.toggle("open", location.hash === "#series"); }
      }

      function closeWheel() {
        if (!openRow) { return; }
        var img = openRow.querySelector("img.drawer-cover");
        if (img && img.dataset.original) { img.src = img.dataset.original; }
        openRow.classList.remove("spinning");
        var d = drawer();
        if (d) { d.classList.remove("dimmed"); }
        openRow = null;
      }

      // Wheel state lives on the row, not in a closure, so these handlers keep
      // working against whatever the last morph left behind.
      function cands(row) {
        return Array.prototype.slice.call(row.querySelectorAll(".wheel-candidate"));
      }
      function at(row) { return parseInt(row.dataset.wheelAt || "0", 10); }

      function fillGhost(ghost, c, fallback) {
        ghost.querySelector(".peek-name").textContent = c.name;
        var badges = ghost.querySelectorAll(".peek-badge");
        badges[0].textContent = c.source;
        badges[0].hidden = !c.source;
        badges[1].textContent = c.pos ? "book " + c.pos : "";
        badges[1].hidden = !c.pos;
        // Each identity wears the face the row would have if picked.
        var img = ghost.querySelector(".ghost-cover");
        var src = c.cover || fallback;
        if (src) { img.src = src; }
        img.hidden = !src;
        ghost.hidden = false;
      }

      function render(row, dir) {
        var list = cands(row), i = at(row);
        var c = list[i].dataset;
        var face = row.querySelector(".wheel-face");
        var item = face.querySelector(".wheel-item");
        var cover = row.querySelector("img.drawer-cover");
        var fallback = row.dataset.originalCover || "";

        item.querySelector(".wheel-name").textContent = c.name;
        var src = item.querySelector(".wheel-source");
        src.textContent = c.source;
        src.hidden = !c.source;
        var pos = item.querySelector(".wheel-pos");
        pos.textContent = c.posLabel || "";
        pos.hidden = !c.posLabel;
        var desc = item.querySelector(".wheel-desc");
        desc.textContent = c.desc;
        desc.hidden = !c.desc;
        if (cover) { cover.src = c.cover || fallback; }

        // The wheel loops, so both directions always show where they lead:
        // with two candidates that is the same place, and the same card above
        // and below is the honest picture of a loop.
        var n = list.length;
        fillGhost(row.querySelector(".wheel-prev"), list[(i - 1 + n) % n].dataset, fallback);
        fillGhost(row.querySelector(".wheel-next"), list[(i + 1) % n].dataset, fallback);
        if (dir) {
          item.classList.remove("roll-up", "roll-down");
          void item.offsetWidth; // restart the animation
          item.classList.add(dir > 0 ? "roll-up" : "roll-down");
        }
      }

      function cycle(row, d) {
        var n = cands(row).length;
        row.dataset.wheelAt = String((at(row) + d + n) % n);
        render(row, d);
      }

      function spin(row) {
        if (openRow === row) { closeWheel(); return; }
        closeWheel();
        var cover = row.querySelector("img.drawer-cover");
        row.dataset.originalCover = cover ? cover.src : "";
        if (cover) { cover.dataset.original = cover.src; }
        row.dataset.wheelAt = "0";
        render(row);
        row.classList.add("spinning");
        var d = drawer();
        if (d) { d.classList.add("dimmed"); }
        openRow = row;
        row.scrollIntoView({ block: "center", behavior: "smooth" });
      }

      function confirmWheel(row) {
        var list = cands(row), c = list[at(row)].dataset;
        if (!c.to) { closeWheel(); return; } // kept the current identity
        var form = row.querySelector(".wheel-form");
        form.querySelector("input[name=to]").value = c.to;
        // The row keeps wearing its current identity until the server agrees.
        // A refusal swaps only the notice slot, so anything written here
        // optimistically would stay on screen as a lie.
        htmx.trigger(form, "submit");
      }

      // Delegated from the body: the drawer lives outside the swapped region,
      // and its rows are replaced on every decision.
      document.body.addEventListener("click", function (e) {
        var hit = function (sel) { return e.target.closest(sel); };
        if (hit(".drawer-dim")) { closeWheel(); return; }
        var btn = hit(".switcher-btn");
        if (btn) { spin(btn.closest(".drawer-row")); return; }
        var ghost = hit(".wheel-ghost");
        if (ghost) {
          cycle(ghost.closest(".drawer-row"), ghost.classList.contains("wheel-next") ? 1 : -1);
          return;
        }
        if (hit(".wheel-ok")) { confirmWheel(hit(".drawer-row")); return; }
        if (hit(".wheel-cancel")) { closeWheel(); }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") { closeWheel(); return; }
        if (!openRow) { return; }
        if (e.key === "ArrowDown") { e.preventDefault(); cycle(openRow, 1); }
        if (e.key === "ArrowUp") { e.preventDefault(); cycle(openRow, -1); }
        if (e.key === "Enter") { e.preventDefault(); confirmWheel(openRow); }
      });

      // The reader's folds are theirs; the markup only says which group starts
      // open. A morph syncs that attribute back to the server's answer, so carry
      // the reader's state across it by hand.
      var folds = null, scrolled = 0;
      document.body.addEventListener("htmx:beforeSwap", function () {
        folds = {};
        document.querySelectorAll("details.drawer-group").forEach(function (d) {
          folds[d.dataset.group] = d.open;
        });
        var body = document.getElementById("drawer-body");
        scrolled = body ? body.scrollTop : 0;
      });
      document.body.addEventListener("htmx:afterSwap", function () {
        if (!folds) { return; }
        document.querySelectorAll("details.drawer-group").forEach(function (d) {
          if (d.dataset.group in folds) { d.open = folds[d.dataset.group]; }
        });
        folds = null;
        var body = document.getElementById("drawer-body");
        if (body) { body.scrollTop = scrolled; }
      });

      // Error responses are swapped by configuration, so a refusal can reach
      // the notice slot. Anything that fails without saying where it belongs —
      // a proxy's 502 page, say — would otherwise be morphed over the card.
      document.body.addEventListener("htmx:beforeSwap", function (e) {
        var xhr = e.detail.xhr;
        if (!xhr || xhr.status < 400 || xhr.getResponseHeader("HX-Retarget")) { return; }
        e.detail.shouldSwap = false;
        var slot = document.getElementById("flash");
        if (slot) {
          slot.innerHTML = '<p class="notice notice--error">Something went wrong. Try again.</p>';
        }
      });

      // Before the first card arrives there is no notice slot to write into,
      // and the skeleton would otherwise sit there for good.
      function loadFailed() {
        app.setAttribute("aria-busy", "false");
        if (!app.querySelector(".waiting--initial")) { return; }
        app.classList.add("failed");
        var err = app.querySelector(".deck-error");
        if (err) { err.hidden = false; }
      }
      document.body.addEventListener("htmx:sendError", loadFailed);
      document.body.addEventListener("htmx:responseError", loadFailed);
      document.body.addEventListener("htmx:timeout", loadFailed);

      window.addEventListener("hashchange", syncDrawer);
      // A morph rebuilds the drawer from server HTML, which carries none of the
      // state these classes hold, so re-derive it every time.
      document.body.addEventListener("htmx:afterSettle", function () {
        // The overlay outlives the swap, so the wheel's transient state is
        // cleared rather than replaced along with the rows. closeWheel, not a
        // bare reset, because it is what restores the row's own cover after a
        // refusal leaves the row on screen.
        closeWheel();
        var d = drawer();
        if (d) { d.classList.remove("dimmed"); }
        document.querySelectorAll(".drawer-row.spinning").forEach(function (r) {
          r.classList.remove("spinning");
        });
        syncDrawer();
        app.setAttribute("aria-busy", "false");
      });
      document.body.addEventListener("htmx:beforeRequest", function () {
        app.classList.remove("failed");
        app.setAttribute("aria-busy", "true");
      });
      syncDrawer();
    })();

    function wireTheme() {
      var btn = document.getElementById("theme-toggle");
      function system() {
        return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function effective() {
        return document.documentElement.dataset.theme || system();
      }
      btn.addEventListener("click", function () {
        var next = effective() === "dark" ? "light" : "dark";
        if (next === system()) {
          // Back to the browser's own preference: follow it instead of pinning it.
          delete document.documentElement.dataset.theme;
          localStorage.removeItem("theme");
        } else {
          document.documentElement.dataset.theme = next;
          localStorage.setItem("theme", next);
        }
      });
    }
    wireTheme();
  </script>
</body>
</html>
